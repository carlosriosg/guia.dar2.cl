# docker-compose.yml para Coolify u otro entorno Docker.
# Coolify detecta este archivo y lo usa para deploy.
#
# Persistent storage: usamos un named volume para /var/www/html/private
# así users.json, lists.json y .secret sobreviven entre re-deploys.
# Para restaurar credenciales en una instalación nueva, usá el botón
# "Restaurar configuración desde archivo" en el login del visor privado.

services:
  guia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guia-dar2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Volume named para persistencia de users.json/lists.json/.secret
      # entre rebuilds. Sin esto, cada redeploy resetea las credenciales.
      - guia-private:/var/www/html/private
    environment:
      - TZ=America/Santiago
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fs http://localhost/proxy.php?action=hash&p=test || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  guia-private:
    driver: local
