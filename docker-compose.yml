# docker-compose.yml para Coolify u otro entorno Docker.
# Coolify detecta este archivo y lo usa para deploy.
#
# Persistent storage: usamos un named volume para /var/www/html/private
# así users.json, lists.json y .secret sobreviven entre re-deploys.
# Para restaurar credenciales en una instalación nueva, usá el botón
# "Restaurar configuración desde archivo" en el login del visor privado.

services:
  guia:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - guia-private:/var/www/html/private
    environment:
      - TZ=America/Santiago

volumes:
  guia-private:
    driver: local
